# Collects Pag-IBIG listings, places the pins, and publishes Pagmamahal Maps to
# Cloudflare Pages (https://pagmamahal-maps.pages.dev). The old GitHub Pages
# address only redirects there. Free for public repositories and on
# Cloudflare's free plan.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (a Cloudflare API token
# with "Cloudflare Pages: Edit" permission for this account).
name: Publish site

on:
  schedule:
    - cron: "17 21 * * *" # daily at 05:17 Philippine time (off the hour: GitHub delays top-of-hour runs)
  workflow_dispatch: # "Run workflow" button; also started after a pin fix
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "data/location-overrides.json"
      - ".github/workflows/publish.yml"

permissions:
  contents: write # save the location cache
  issues: write # create the labels the report form and checker use
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Make sure the report labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create wrong-pin     --color d9622b --description "Pin in the wrong place report" --force
          gh label create needs-review  --color fbca04 --description "Pin report waiting for a human or the weekly review" --force
          gh label create needs-info    --color c5def5 --description "Pin report needs a fixed location" --force
          gh label create fixed         --color 0e8a16 --description "Pin fix applied" --force
          gh label create approved      --color 0e8a16 --description "Maintainer approves this pin report" --force
          gh label create claude-approve --color bfdadc --description "Weekly review recommends approving" --force
          gh label create claude-reject  --color f9d0c4 --description "Weekly review recommends rejecting" --force
          gh label create claude-unsure  --color ededed --description "Weekly review couldn't decide" --force

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Month (open map data is refreshed monthly)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore open map data
        id: opendata
        uses: actions/cache@v4
        with:
          path: |
            data/overture
            data/boundaries/src
          key: open-data-${{ steps.month.outputs.month }}

      - name: Download open map data (once a month)
        if: steps.opendata.outputs.cache-hit != 'true'
        run: |
          npm run update-boundaries
          npm run update-overture

      - name: Collect listings and place pins
        run: npm run fetch -- --osm-budget 60

      # Small square photos for the map pins and list (about 6 KB each). Kept
      # between runs so only new properties need one; old ones are deleted.
      - name: Restore photo thumbnails
        uses: actions/cache/restore@v4
        with:
          path: public/thumbs
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-

      - name: Find property photos
        continue-on-error: true # photos are a bonus; never block the daily update
        run: node scripts/photos.mjs --max-lookups 1500 --max-thumbs 6000 --minutes 30

      - name: Keep photo thumbnails for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: public/thumbs
          key: thumbs-${{ github.run_id }}

      - name: Save new location lookups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Once a month, record a heartbeat so GitHub keeps the daily schedule enabled
          # (scheduled workflows stop after 60 days without repository activity).
          echo "${{ steps.month.outputs.month }}" > data/last-refresh.txt
          git add data/geocode-cache.json data/photo-cache.json data/last-refresh.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update location and photo caches"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::Couldn't save the location cache"; exit 1; }
          fi

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 47f6ce454701964dd5a38d930c27894c
        run: npx --yes wrangler@4.14.0 pages deploy public --project-name pagmamahal-maps --branch main --commit-dirty=true

      - name: Build the redirect for the old GitHub Pages address
        run: |
          mkdir -p redirect
          cat > redirect/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Pagmamahal Maps has moved</title>
          <meta http-equiv="refresh" content="0; url=https://pagmamahal-maps.pages.dev/">
          <link rel="canonical" href="https://pagmamahal-maps.pages.dev/">
          <p>Pagmamahal Maps has moved to <a href="https://pagmamahal-maps.pages.dev/">pagmamahal-maps.pages.dev</a>.</p>
          EOF
          cp redirect/index.html redirect/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
